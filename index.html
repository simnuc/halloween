    <!-- Caricamento Tailwind per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Caricamento React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Caricamento Babel per compilare il codice React nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Reset totale per evitare margini bianchi su iOS / Safari */
        :root {
            color-scheme: dark;
            background: #030712;
        }
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            min-width: 0;
            min-height: 100%;
            background-color: #030712;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        html {
            min-height: 100%;
            overscroll-behavior-x: none;
            background: #030712;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: clip;
            overscroll-behavior-x: none;
        }
        #root { min-height: 100vh; min-height: 100dvh; overflow-x: clip; }
        button, input, textarea { font: inherit; }
        img { max-width: 100%; }
        @supports not (overflow: clip) {
            body, #root { overflow-x: hidden; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #6b21a8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9333ea; }

        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

</head>
<body class="bg-gray-950 text-gray-100 font-sans">
    <div id="root"></div>

    <!-- Moduli Cloud Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <!-- Codice dell'Applicazione -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        let Firebase, auth, db;

        const safeStorage = {
            getItem: (key) => { try { return window.localStorage.getItem(key); } catch(e) { return null; } },
            setItem: (key, val) => { try { window.localStorage.setItem(key, val); } catch(e) {} },
            removeItem: (key) => { try { window.localStorage.removeItem(key); } catch(e) {} }
        };

        const myFirebaseConfig = {
          apiKey: "AIzaSyCgXBkwksRawNOALLK-nzgbx6nqCgjmaI4",
          authDomain: "festahalloween2026-e7ddb.firebaseapp.com",
          projectId: "festahalloween2026-e7ddb",
          storageBucket: "festahalloween2026-e7ddb.firebasestorage.app",
          messagingSenderId: "599953507330",
          appId: "1:599953507330:web:423e0368988c349165131b"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'halloween-2d-lingotto';

        // --- ICONE SVG ---
        const Ghost = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 10h.01"/><path d="M14 10h.01"/><path d="M10 14a3.38 3.38 0 0 0 2 0"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>;
        const Skull = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>;
        const Pumpkin = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4"/><path d="M5.6 7A9.4 9.4 0 0 0 2 13.6c0 4.6 4.5 8.4 10 8.4s10-3.8 10-8.4A9.4 9.4 0 0 0 18.4 7"/><path d="M16 11l-2 3h4Z"/><path d="M8 11l2 3H6Z"/><path d="M10 16h4"/></svg>;
        const ImageIcon = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>;
        const Send = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
        const Trophy = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const Settings = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const Lock = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const CheckCircle = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;

        const compressImage = (file, maxWidth, maxHeight, quality) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        function App() {
            const [authUser, setAuthUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [authError, setAuthError] = useState('');
            const [profileChecked, setProfileChecked] = useState(false);
            const [user, setUser] = useState(null);
            const [posts, setPosts] = useState([]);
            const [votingData, setVotingData] = useState({ status: 'waiting', candidates: [], votes: {} }); 
            const [isAdmin, setIsAdmin] = useState(false);
            const [activeTab, setActiveTab] = useState('feed');
            const [profileMenuOpen, setProfileMenuOpen] = useState(false);
            const [selectedProfile, setSelectedProfile] = useState(null);
            
            const { signInAnonymously, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence, collection, onSnapshot, doc, setDoc, getDoc, addDoc, updateDoc } = Firebase;

            useEffect(() => {
                let disposed = false;
                // Evita una schermata di caricamento infinita se Safari o Firebase bloccano l'accesso.
                const timeoutId = setTimeout(() => {
                    if (!disposed) setAuthError('Firebase non ha completato l’accesso. Verifica la connessione e apri questa app dal suo indirizzo web pubblicato, non come file HTML scaricato.');
                }, 15000);
                const initAuth = async () => {
                    try {
                        // Mantiene la sessione Firebase anche dopo il refresh del browser.
                        await setPersistence(auth, browserLocalPersistence);
                        if (auth.currentUser) return;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) {
                        console.error('Errore Auth:', e);
                        if (!disposed) setAuthError('Accesso a Firebase non riuscito (' + (e?.code || 'errore di rete') + '). Controlla la connessione e che l’autenticazione anonima sia abilitata in Firebase.');
                    }
                };
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    if (disposed) return;
                    setAuthUser(u);
                    if (u) {
                        clearTimeout(timeoutId);
                        setAuthError('');
                        setAuthReady(true);
                    }
                }, (e) => {
                    console.error('Errore osservazione autenticazione:', e);
                    if (!disposed) setAuthError('Errore di autenticazione Firebase: ' + (e?.code || e?.message || 'errore sconosciuto'));
                });
                initAuth();
                return () => { disposed = true; clearTimeout(timeoutId); unsubscribe(); };
            }, []);

            useEffect(() => {
                if (!authUser) return;

                let cancelled = false;
                setProfileChecked(false);
                const loadProfile = async () => {
                    let loadedProfile = null;
                    try {
                        const userRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'info');
                        const docSnap = await getDoc(userRef);
                        if (docSnap.exists()) loadedProfile = docSnap.data();
                    } catch (e) {
                        console.error("Errore recupero profilo da Firestore:", e);
                    }
                    // Fallback locale anche quando Firestore è temporaneamente irraggiungibile.
                    if (!loadedProfile) {
                        try {
                            const savedUser = safeStorage.getItem('hw_user');
                            if (savedUser) loadedProfile = JSON.parse(savedUser);
                        } catch (e) { console.error("Profilo locale non leggibile:", e); }
                    }
                    if (!cancelled) {
                        if (loadedProfile) {
                            setUser(loadedProfile);
                            safeStorage.setItem('hw_user', JSON.stringify(loadedProfile));
                            // Se il profilo esiste solo in locale, prova a sincronizzarlo con l'utente corrente.
                            try {
                                const userRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'info');
                                await setDoc(userRef, { ...loadedProfile, id: authUser.uid });
                                setUser({ ...loadedProfile, id: authUser.uid });
                                safeStorage.setItem('hw_user', JSON.stringify({ ...loadedProfile, id: authUser.uid }));
                            } catch (e) { console.error("Sincronizzazione profilo non riuscita:", e); }
                        } else {
                            setUser(null);
                        }
                        setProfileChecked(true);
                    }
                };
                loadProfile();

                const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                const unsubPosts = onSnapshot(postsRef, (snapshot) => {
                    const loadedPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    loadedPosts.sort((a, b) => b.timestamp - a.timestamp);
                    setPosts(loadedPosts);
                }, (err) => console.error("Errore fetch posts", err));

                const votingRef = doc(db, 'artifacts', appId, 'public', 'data', 'voting', 'main');
                const unsubVoting = onSnapshot(votingRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setVotingData(docSnap.data());
                    } else {
                        setDoc(votingRef, { status: 'waiting', candidates: [], votes: {} });
                    }
                }, (err) => console.error("Errore fetch votazioni", err));

                return () => { cancelled = true; unsubPosts(); unsubVoting(); };
            }, [authUser]);

            const handleLogout = async () => {
                setProfileMenuOpen(false);
                setUser(null);
                setProfileChecked(false);
                safeStorage.removeItem('hw_user');
                try {
                    // Chiude la sessione anonima corrente e ne crea una nuova,
                    // così l'app torna alla registrazione senza restare bloccata.
                    await signOut(auth);
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error('Errore durante il logout:', e);
                    setAuthError('Non è stato possibile uscire. Controlla la connessione e riprova.');
                }
            };

            const handleViewProfile = async (post) => {
                if (!post) return;
                const fallbackProfile = {
                    id: post.authorId || '',
                    costumeName: post.authorCostume || 'Profilo della cripta',
                    avatar: post.authorAvatar || '👻',
                    realName: post.authorRealName || ''
                };
                let profileToShow = fallbackProfile;
                if (post.authorId) {
                    try {
                        const profileRef = doc(db, 'artifacts', appId, 'users', post.authorId, 'profile', 'info');
                        const profileSnap = await getDoc(profileRef);
                        if (profileSnap.exists()) profileToShow = { ...fallbackProfile, ...profileSnap.data(), id: post.authorId };
                    } catch (e) {
                        console.error('Impossibile caricare il profilo pubblico:', e);
                    }
                }
                setSelectedProfile(profileToShow);
                setActiveTab('userProfile');
            };

            const handleAddPost = async (newPost) => {
                if (!authUser) throw new Error("Accesso a Firebase non ancora pronto. Riprova tra qualche secondo.");
                const postsRef = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                const created = await addDoc(postsRef, newPost);
                // Mostra subito il post; lo snapshot realtime riallineerà poi il feed.
                setPosts(current => {
                    if (current.some(p => p.id === created.id)) return current;
                    return [{ id: created.id, ...newPost }, ...current].sort((a, b) => b.timestamp - a.timestamp);
                });
                return created.id;
            };

            const handleReaction = async (post, emoji, userId) => {
                if (!authUser || !post?.id) return;
                const current = post.reactions || {};
                const users = Array.isArray(current[emoji]) ? current[emoji] : [];
                const nextUsers = users.includes(userId) ? users.filter(id => id !== userId) : [...users, userId];
                const nextReactions = { ...current, [emoji]: nextUsers };
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', 'posts', post.id);
                await updateDoc(postRef, { reactions: nextReactions });
            };

            useEffect(() => {
                const navigate = (event) => setActiveTab(event.detail || 'feed');
                window.addEventListener('app-navigate', navigate);
                return () => window.removeEventListener('app-navigate', navigate);
            }, []);

            const saveVoting = async (newVoting) => {
                if (!authUser) return;
                const votingRef = doc(db, 'artifacts', appId, 'public', 'data', 'voting', 'main');
                await setDoc(votingRef, newVoting);
            };

            if (authError) {
                return (
                    <div className="min-h-screen min-h-[100dvh] bg-gray-950 flex flex-col items-center justify-center p-6 text-center text-gray-300">
                        <Pumpkin className="w-12 h-12 text-orange-500 mb-4" />
                        <h2 className="text-xl font-bold text-orange-400 mb-3">La cripta non si apre</h2>
                        <p className="max-w-md text-sm leading-6 mb-5">{authError}</p>
                        <button onClick={() => window.location.reload()} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-3 rounded-xl">Riprova</button>
                    </div>
                );
            }

            if (!authReady || !authUser || !profileChecked) {
                return (
                    <div className="min-h-screen min-h-[100dvh] bg-gray-950 flex flex-col items-center justify-center p-6 text-center text-gray-300">
                        <Pumpkin className="w-12 h-12 text-orange-500 mb-4 animate-pulse" />
                        <p>Preparazione della tua cripta...</p>
                    </div>
                );
            }

            if (!user) {
                return (
                    <RegistrationScreen 
                        authUserReady={!!authUser}
                        onRegister={async (userData) => {
                            let currentAuthId = authUser ? authUser.uid : 'user_' + Date.now();
                            const finalUserData = { ...userData, id: currentAuthId };
                            setUser(finalUserData);
                            safeStorage.setItem('hw_user', JSON.stringify(finalUserData));
                            try {
                                if (auth && auth.currentUser) {
                                    const userRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'profile', 'info');
                                    await setDoc(userRef, finalUserData);
                                }
                            } catch (e) { console.error("Errore salvataggio profilo", e); }
                        }} 
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-950 text-gray-100 font-sans pb-28 pt-safe">
                    <header className="bg-gray-900 border-b border-purple-900 sticky top-0 z-50 shadow-lg shadow-purple-900/20">
                        <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <Pumpkin className="w-8 h-8 text-orange-500 shrink-0" />
                                <h1 className="text-lg md:text-xl font-bold bg-gradient-to-r from-orange-500 to-purple-500 bg-clip-text text-transparent truncate">
                                    Halloween al 2D Lingotto
                                </h1>
                            </div>
                            <div className="relative shrink-0">
                                <button type="button" aria-label="Apri menu profilo" aria-expanded={profileMenuOpen} onClick={() => setProfileMenuOpen(v => !v)} className="w-10 h-10 rounded-full overflow-hidden bg-gray-800 border-2 border-purple-500 flex items-center justify-center text-xl shadow-md focus:outline-none focus:ring-2 focus:ring-orange-400">
                                    {String(user.avatar || '👻').startsWith('http') || String(user.avatar || '👻').startsWith('data:image') ? <img src={user.avatar} alt="avatar" className="w-full h-full object-cover" /> : user.avatar}
                                </button>
                                {profileMenuOpen && <>
                                    <button aria-label="Chiudi menu" className="fixed inset-0 z-40 cursor-default" onClick={() => setProfileMenuOpen(false)}></button>
                                    <div className="absolute right-0 top-12 z-50 w-56 rounded-2xl border border-purple-800 bg-gray-900 p-2 shadow-2xl">
                                        <div className="px-3 py-2 border-b border-gray-800 mb-1"><p className="font-bold text-white truncate">{user.costumeName || user.realName || 'Il tuo profilo'}</p><p className="text-xs text-gray-400">La tua cripta personale</p></div>
                                        <button onClick={() => { setActiveTab('profile'); setProfileMenuOpen(false); }} className="w-full text-left rounded-xl px-3 py-2.5 text-sm hover:bg-purple-900/60">👤 Vedi profilo</button>
                                        <button onClick={() => { setActiveTab('admin'); setProfileMenuOpen(false); }} className="w-full text-left rounded-xl px-3 py-2.5 text-sm text-red-300 hover:bg-red-950/60">⚙️ Admin</button>
                                        <button onClick={handleLogout} className="w-full text-left rounded-xl px-3 py-2.5 text-sm text-orange-300 hover:bg-orange-950/60">↪️ Logout</button>
                                    </div>
                                </>}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto p-4">
                        {activeTab === 'feed' && <FeedTab user={user} posts={posts} onAddPost={handleAddPost} onReaction={handleReaction} onViewProfile={handleViewProfile} />}
                        {activeTab === 'voting' && <VotingTab user={user} votingData={votingData} setVotingData={saveVoting} />}
                        {activeTab === 'profile' && <ProfileTab user={user} />}
                        {activeTab === 'userProfile' && <PublicProfileTab profile={selectedProfile} onBack={() => setActiveTab('feed')} />}
                        {activeTab === 'payments' && <PaymentsTab />}
                        {activeTab === 'admin' && <AdminTab isAdmin={isAdmin} setIsAdmin={setIsAdmin} votingData={votingData} setVotingData={saveVoting} />}
                    </main>

                    <nav className="fixed bottom-0 left-0 w-full bg-gray-900 border-t border-purple-900 pb-safe z-50 shadow-2xl">
                        <div className="max-w-3xl mx-auto flex justify-around p-2">
                            <button onClick={() => setActiveTab('feed')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'feed' ? 'text-orange-500 scale-110' : 'text-gray-500 hover:text-gray-300'}`}>
                                <Ghost className="w-6 h-6 mb-1" />
                                <span className="text-xs font-bold">Bacheca</span>
                            </button>

Intestatario: ${beneficiary}

        function RegistrationScreen({ onRegister, authUserReady }) {

        function FeedTab({ user, posts, onAddPost, onReaction, onViewProfile }) {
            const [text, setText] = useState('');
            const [capturedImage, setCapturedImage] = useState('');
            const [cameraOpen, setCameraOpen] = useState(false);
            const [isPosting, setIsPosting] = useState(false);
            const [postError, setPostError] = useState('');
            const [postSuccess, setPostSuccess] = useState(false);
            const [reactionError, setReactionError] = useState('');
            const videoRef = useRef(null);
            const streamRef = useRef(null);
            const reactionOptions = ['❤️', '😂', '🔥', '💀', '👏'];

            const stopCamera = () => {
                if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop());
                streamRef.current = null;
                if (videoRef.current) videoRef.current.srcObject = null;
                setCameraOpen(false);
            };
            useEffect(() => () => { if (streamRef.current) streamRef.current.getTracks().forEach(track => track.stop()); }, []);

            const openCamera = async () => {
                setPostError('');
                try {
                    if (!navigator.mediaDevices?.getUserMedia) throw new Error('camera-not-supported');
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                    streamRef.current = stream;
                    setCameraOpen(true);
                    setTimeout(() => { if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play().catch(() => {}); } }, 100);
                } catch (err) {
                    console.error('Accesso fotocamera non riuscito:', err);
                    setPostError('Non riesco ad aprire la fotocamera. Consenti l’accesso e apri la pagina tramite HTTPS (su iPhone l’HTTP locale spesso non basta).');
                }
            };
            const takePhoto = () => {
                const video = videoRef.current;
                if (!video || !video.videoWidth) { setPostError('La fotocamera si sta ancora avviando: riprova tra un secondo.'); return; }
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, 800 / video.videoWidth, 800 / video.videoHeight);
                canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                setCapturedImage(canvas.toDataURL('image/jpeg', 0.68));
                stopCamera();
            };
            const handlePost = async (e) => {
                e.preventDefault();
                if (!text.trim() && !capturedImage) return;
                setIsPosting(true); setPostError(''); setPostSuccess(false);
                try {
                    await onAddPost({ authorId: user.id, authorCostume: user.costumeName, authorAvatar: user.avatar, text: text.trim(), imageUrl: capturedImage, reactions: {}, timestamp: Date.now() });
                    setText(''); setCapturedImage(''); setPostSuccess(true);
                } catch (error) {
                    console.error('Errore pubblicazione post:', error);
                    setPostError(error?.code === 'permission-denied' ? 'Firebase ha rifiutato la pubblicazione (permessi Firestore). Controlla le regole di sicurezza.' : 'Non è stato possibile pubblicare il post. Controlla la connessione e riprova.');
                } finally { setIsPosting(false); }
            };
            const formatDate = (ms) => { const d = new Date(ms); return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; };

            return (
                <div className="space-y-6">
                    <div className="bg-gray-900 p-4 rounded-2xl border border-gray-800 shadow-md">
                        <form onSubmit={handlePost}>
                            <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Scrivi un pensiero spettrale..." className="w-full bg-gray-800 text-white border border-gray-700 rounded-xl p-3 resize-none min-h-[90px] text-base" />
                            {cameraOpen && <div className="mt-3 space-y-3"><video ref={videoRef} autoPlay playsInline muted className="w-full rounded-xl bg-black max-h-96 object-contain" /><div className="flex gap-2"><button type="button" onClick={takePhoto} className="flex-1 bg-orange-600 text-white font-bold py-3 rounded-xl">📸 Scatta istantanea</button><button type="button" onClick={stopCamera} className="bg-gray-700 text-white px-4 rounded-xl">Annulla</button></div></div>}
                            {capturedImage && <div className="mt-3"><img src={capturedImage} alt="Anteprima istantanea appena scattata" className="w-full max-h-80 object-contain rounded-xl border border-purple-500/40"/><button type="button" onClick={() => setCapturedImage('')} className="mt-2 text-sm text-red-300 underline">Scatta di nuovo / rimuovi foto</button></div>}
                            {postError && <p role="alert" className="mt-3 rounded-xl border border-red-500/40 bg-red-950/40 p-3 text-sm text-red-300">{postError}</p>}
                            {postSuccess && <p role="status" className="mt-3 rounded-xl border border-green-500/30 bg-green-950/30 p-3 text-sm text-green-300">Post pubblicato! La cripta ha ricevuto la tua prova fotografica. 👻</p>}
                            <div className="flex flex-wrap justify-between items-center gap-2 mt-3"><button type="button" onClick={openCamera} disabled={cameraOpen} className="text-gray-200 hover:text-orange-400 flex items-center space-x-2 p-2 rounded-lg bg-gray-800"><ImageIcon className="w-5 h-5"/><span className="text-sm font-bold">📸 Scatta una foto ora</span></button><button type="submit" disabled={(!text.trim() && !capturedImage) || isPosting || cameraOpen} className="bg-purple-600 disabled:opacity-50 text-white px-5 py-2.5 rounded-xl font-bold flex items-center space-x-2"><span>{isPosting ? 'Invio...' : 'Pubblica'}</span><Send className="w-4 h-4"/></button></div>
                            
                        </form>
                    </div>
                    <div className="space-y-4">
                        {posts.length === 0 ? <div className="text-center text-gray-500 py-10"><Ghost className="w-12 h-12 mx-auto mb-3 opacity-20"/><p>La bacheca è vuota. Sii tu il primo fantasma con prove.</p></div> : posts.map(post => (
                            <div key={post.id} className="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 shadow-md">
                                <div className="p-4"><div className="flex justify-between items-start mb-3"><div className="flex items-center space-x-3"><button type="button" onClick={() => onViewProfile(post)} aria-label={`Visualizza il profilo di ${post.authorCostume || 'questo utente'}`} title="Visualizza profilo" className="w-10 h-10 rounded-full overflow-hidden bg-gray-800 border border-purple-500/50 flex items-center justify-center text-xl shrink-0 cursor-pointer hover:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-400">{String(post.authorAvatar || '👻').startsWith('http') || String(post.authorAvatar || '👻').startsWith('data:image') ? <img src={post.authorAvatar} alt="Avatar" className="w-full h-full object-cover"/> : (post.authorAvatar || '👻')}</button><div><button type="button" onClick={() => onViewProfile(post)} className="font-bold text-orange-400 text-left hover:underline">{post.authorCostume}</button><p className="text-xs text-gray-500">{formatDate(post.timestamp)}</p></div></div></div>{post.text && <p className="text-gray-200 mt-2 whitespace-pre-wrap text-base">{post.text}</p>}</div>
                                {post.imageUrl && <div className="w-full bg-black"><img src={post.imageUrl} alt="Foto scattata sul momento" className="w-full h-auto max-h-96 object-contain"/></div>}
                                <div className="p-3 border-t border-gray-800"><div className="flex flex-wrap gap-2">{reactionOptions.map(emoji => { const users = (post.reactions && post.reactions[emoji]) || []; const selected = users.includes(user.id); return <button key={emoji} type="button" onClick={async () => { setReactionError(''); try { await onReaction(post, emoji, user.id); } catch(e) { console.error(e); setReactionError('Reazione non salvata: controlla i permessi Firestore.'); } }} className={`px-3 py-1.5 rounded-full border text-sm ${selected ? 'bg-purple-600/30 border-purple-400' : 'bg-gray-800 border-gray-700'}`} aria-label={`Reazione ${emoji}`}>{emoji} <span>{users.length}</span></button>; })}</div>{reactionError && <p className="text-xs text-red-300 mt-2">{reactionError}</p>}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function VotingTab({ user, votingData, setVotingData }) {
            const hasVoted = !!votingData.votes[user.id];

            const handleVote = (candidateName) => {
                if (hasVoted || votingData.status !== 'active') return;
                const newVotingData = { ...votingData };
                newVotingData.votes[user.id] = candidateName;
                setVotingData(newVotingData);
            };

            const calculateResults = () => {
                const tallies = {};
                votingData.candidates.forEach(c => tallies[c] = 0);
                Object.values(votingData.votes).forEach(vote => { if (tallies[vote] !== undefined) tallies[vote]++; });
                return Object.entries(tallies).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
            };

            if (votingData.status === 'waiting') {
                return (
                    <div className="flex flex-col items-center justify-center py-20 text-center space-y-4">
                        <div className="bg-gray-900 p-6 rounded-full border-2 border-dashed border-gray-700"><Lock className="w-16 h-16 text-gray-600" /></div>
                        <h2 className="text-2xl font-bold text-gray-300">Votazioni Chiuse</h2>
                        <p className="text-gray-500 max-w-sm">L’aura è in fase di accumulo. Non tutti sono pronti a essere giudicati. 🧘‍♂️</p>
                    </div>
                );
            }

            if (votingData.status === 'active') {
                return (
                    <div className="space-y-6">
                        <div className="bg-gradient-to-r from-purple-900 to-gray-900 p-6 rounded-2xl border border-purple-500/30 text-center shadow-lg">
                            <Trophy className="w-12 h-12 text-yellow-500 mx-auto mb-2 animate-bounce" />
                            <h2 className="text-2xl font-black text-white">Chi ha più aura? ✨</h2>
                            <p className="text-purple-200 mt-2">Non è un concorso di bellezza: è una misurazione scientifica di presenza scenica, drip e potere mistico.</p>
                        </div>
                        <div className="space-y-3">
                            {votingData.candidates.map(candidate => (
                                <button key={candidate} onClick={() => handleVote(candidate)} disabled={hasVoted} className={`w-full p-4 rounded-xl text-left border flex items-center justify-between ${votingData.votes[user.id] === candidate ? 'bg-purple-600/20 border-purple-500' : hasVoted ? 'bg-gray-900 border-gray-800 opacity-50' : 'bg-gray-900 border-gray-700 hover:border-orange-500'}`}>
                                    <span className="font-bold text-lg text-gray-200">{candidate}</span>
                                    {votingData.votes[user.id] === candidate && <CheckCircle className="w-6 h-6 text-purple-400" />}
                                </button>
                            ))}
                        </div>
                        {hasVoted && <div className="bg-green-900/20 border border-green-500/30 p-4 rounded-xl flex justify-center space-x-2 text-green-400"><CheckCircle className="w-5 h-5" /><span className="font-semibold">Voto registrato!</span></div>}
                    </div>
                );
            }

            if (votingData.status === 'finished') {
                const results = calculateResults();
                const winner = results[0];

                return (
                    <div className="space-y-6">
                        <div className="bg-gradient-to-br from-yellow-900/50 to-orange-900/50 p-8 rounded-3xl border border-yellow-600/50 text-center shadow-2xl">
                            <Trophy className="w-20 h-20 text-yellow-400 mx-auto mb-4" />
                            <h2 className="text-3xl font-black text-white mb-2">Classifica dell’Aura</h2>
                            <p className="text-yellow-100/80 mb-4">Il server ha parlato. Gli haters possono accomodarsi nella dimensione parallela.</p>
                            {winner && winner.count > 0 ? (
                                <div><h3 className="text-4xl font-black text-yellow-400">{winner.name}</h3><p className="text-yellow-500/80 font-bold mt-2">con {winner.count} voti! Aura certificata: illegale ✨</p></div>
                            ) : (<p className="text-gray-400">Nessun voto registrato.</p>)}
                        </div>
                        <div className="bg-gray-900 rounded-2xl border border-gray-800 p-4">
                            <h4 className="font-bold text-gray-400 mb-4 uppercase text-sm">Classifica</h4>
                            <div className="space-y-3">
                                {results.map((res, idx) => (
                                    <div key={res.name} className="flex items-center justify-between p-3 bg-gray-800/50 rounded-xl">
                                        <div className="flex items-center space-x-3"><span className="text-gray-500 font-bold">{idx + 1}°</span><span className="font-bold text-gray-200">{res.name}</span></div>
                                        <span className="bg-gray-950 px-3 py-1 rounded-lg text-sm font-bold text-purple-400">{res.count} voti</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
        }

        function AdminTab({ isAdmin, setIsAdmin, votingData, setVotingData }) {
            const [password, setPassword] = useState('');
            const [newCandidate, setNewCandidate] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'halloween24') setIsAdmin(true); else alert("Password errata!");
            };

            const addCandidate = (e) => {
                e.preventDefault();
                if (!newCandidate.trim()) return;
                setVotingData({ ...votingData, candidates: [...votingData.candidates, newCandidate.trim()] });
                setNewCandidate('');
            };

            if (!isAdmin) {
                return (
                    <div className="max-w-sm mx-auto mt-20 bg-gray-900 p-8 rounded-3xl border border-red-900/50 text-center shadow-xl">
                        <Lock className="w-12 h-12 text-red-500 mx-auto mb-4" />
                        <h2 className="text-2xl font-bold text-white mb-6">Accesso Admin</h2>
                        <form onSubmit={handleLogin}>
                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password segreta..." className="w-full bg-gray-800 text-white border border-gray-700 rounded-xl p-3 text-center mb-4 text-base focus:outline-none focus:border-red-500" />
                            <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl transition">Sblocca</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    <div className="bg-red-900/20 border border-red-500/30 p-4 rounded-2xl flex items-center justify-between">
                        <div className="flex items-center space-x-2 text-red-400"><Settings className="w-6 h-6" /><h2 className="text-xl font-bold">Pannello</h2></div>
                        <button onClick={() => setIsAdmin(false)} className="text-gray-400 bg-gray-800 px-3 py-1.5 rounded-lg text-sm">Esci</button>
                    </div>

                    <div className="bg-gray-900 rounded-2xl border border-gray-800 p-5">
                        <h3 className="font-bold text-gray-300 mb-4">Gestione Votazioni</h3>
                        <div className="flex space-x-2 mb-6">
                            <button onClick={() => setVotingData({ ...votingData, status: 'waiting' })} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${votingData.status === 'waiting' ? 'bg-gray-700 text-white' : 'bg-gray-800 text-gray-500'}`}>In Attesa</button>
                            <button onClick={() => setVotingData({ ...votingData, status: 'active' })} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${votingData.status === 'active' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-500'}`}>Avvia Voto</button>
                            <button onClick={() => setVotingData({ ...votingData, status: 'finished' })} className={`flex-1 py-2.5 rounded-xl text-xs font-bold ${votingData.status === 'finished' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-500'}`}>Termina</button>
                        </div>
                        <div className="mb-6">
                            <form onSubmit={addCandidate} className="flex space-x-2">
                                <input type="text" value={newCandidate} onChange={(e) => setNewCandidate(e.target.value)} placeholder="Nome travestimento..." className="flex-1 bg-gray-800 text-white border border-gray-700 rounded-xl p-2.5 text-sm" disabled={votingData.status !== 'waiting'} />
                                <button type="submit" disabled={!newCandidate.trim() || votingData.status !== 'waiting'} className="bg-red-600 disabled:opacity-50 text-white px-4 py-2.5 rounded-xl font-bold text-sm">Aggiungi</button>
                            </form>
                        </div>
                        <div>
                            <h4 className="font-semibold text-gray-400 text-sm mb-2">Candidati Attuali</h4>
                            <div className="space-y-2">
                                {votingData.candidates.map(candidate => (
                                    <div key={candidate} className="flex justify-between items-center bg-gray-800 p-3 rounded-lg">
                                        <span className="text-gray-200">{candidate}</span>
                                        <button onClick={() => setVotingData({ ...votingData, candidates: votingData.candidates.filter(c => c !== candidate) })} disabled={votingData.status !== 'waiting'} className="text-red-400 disabled:opacity-50 text-sm font-semibold">Rimuovi</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const initApp = () => {
            if (!window.FirebaseModules) {
                setTimeout(initApp, 50);
                return;
            }
            
            Firebase = window.FirebaseModules;
            const root = ReactDOM.createRoot(document.getElementById('root'));
            
            try {
                if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "INCOLLA_QUI") {
                    throw new Error("Manca la configurazione Firebase");
                }
                const app = Firebase.initializeApp(firebaseConfig);
                auth = Firebase.getAuth(app);
                db = Firebase.getFirestore(app);
                root.render(<App />);
            } catch(e) {
                console.error("Errore inizializzazione Firebase:", e);
                root.render(
                    <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center p-8 text-center text-white">
                        <svg className="w-16 h-16 text-red-500 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        <h2 className="text-2xl font-bold text-red-500 mb-2">Database non configurato!</h2>
                        <p className="text-gray-400">Devi inserire i parametri di Firebase nel blocco di configurazione.</p>
                    </div>
                );
            }
        };
        initApp();
    </script>
</body>
</html>
